# Dependabot — l'absence de ce fichier explique le retard accumulé sur les
# actions GitHub (jusqu'à trois majeures). Regroupe les mises à jour pour éviter
# une PR par dépendance.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Les modules golang.org/x bougent ensemble et sans rupture.
      golang-x:
        patterns:
          - "golang.org/x/*"
      # Les dépendances indirectes de testcontainers/docker sont nombreuses et
      # sans impact fonctionnel : une seule PR suffit.
      testing:
        patterns:
          - "github.com/testcontainers/*"
          - "github.com/docker/*"
          - "github.com/stretchr/*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-tooling:
        dependency-type: development
        # typescript est tenu à l'écart du groupe : la montée en 7.x sort du
        # « peer » déclaré par typescript-eslint (>=4.8.4 <6.1.0 en 8.69.0),
        # et `npm ci` échoue alors sur ERESOLVE avant toute compilation. Groupé,
        # un seul paquet bloquait les neuf autres montées d'outillage.
        # Le motif vise le nom exact : @typescript-eslint/* et typescript-eslint
        # restent dans le groupe.
        exclude-patterns:
          - "typescript"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"
