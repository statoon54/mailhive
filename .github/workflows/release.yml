name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Binaires multi-plateformes + notes de version via GoReleaser.
  goreleaser:
    name: Binaires (GoReleaser)
    runs-on: ubuntu-latest
    permissions:
      contents: write # créer la GitHub Release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historique complet pour le changelog

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Notes de release : l'en-tête vient du CHANGELOG, la liste des commits
      # étant générée ensuite par GoReleaser. Sans cet en-tête, une rupture de
      # contrat n'apparaît que comme un « ! » dans un sujet de commit.
      # Le fichier est écrit hors du dépôt : GoReleaser valide la propreté de
      # l'arbre git avant d'exécuter ses hooks, et un fichier non suivi à la
      # racine suffit à faire échouer la publication sur « git is dirty ».
      - name: En-tête des notes depuis le CHANGELOG
        run: |
          ./scripts/changelog-section.sh "${{ github.ref_name }}" \
            > "$RUNNER_TEMP/release-header.md"
          cat "$RUNNER_TEMP/release-header.md"
          git status --porcelain

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-header=${{ runner.temp }}/release-header.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Image conteneur multi-arch publiée sur GitHub Container Registry.
  docker:
    name: Image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mailhive
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
