name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Garde-fou de modernisation : `go fix` applique les correcteurs du
      # toolchain (errors.AsType, WaitGroup.Go, range sur entier…). Un diff non
      # vide signifie que du code est revenu à un idiome dépassé.
      # Le frontend est exclu : node_modules contient du Go vendored.
      - name: Modernisation (go fix)
        run: make modernize-check

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2

      - name: Unit tests
        run: make test-unit

  # Les tests d'intégration (testcontainers : PostgreSQL, Redis) couvrent les
  # repositories et l'encodage JSONB — précisément ce que la migration json/v2
  # touche. Ils existaient sans jamais être exécutés en CI.
  integration:
    name: Tests d'intégration (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        run: make test-integration

  security:
    name: Sécurité (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build
